spring:
  application:
    name: sobi-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/sobi
    username: ${POSTGRES_USER:sobi}
    password: ${POSTGRES_PASSWORD:localdev}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true


  flyway:
    enabled: true
    baseline-on-migrate: true   # 기존 빈 DB에 처음 붙을 때 안전장치
    locations:
      - classpath:db/migration
      - classpath:db/seed/local # 더미데이터용 경로. 이거는 배포시에는 삭제해야함


  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:localdev}

  servlet:
    multipart:
      max-file-size: 20MB      # 신청 서류는 서비스에서 10MB 로 더 엄격하게 막는다
      max-request-size: 50MB

  task:
    execution:
      # 서류 검증 전용 풀(AsyncConfig)을 등록해도 기본 applicationTaskExecutor 가 사라지지 않게 한다
      mode: force

  jackson:
    mapper:
      sort-properties-alphabetically: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

jwt:
  secret: ${JWT_SECRET}
  access-exp: ${JWT_ACCESS_EXP:1800000}
  refresh-exp: ${JWT_REFRESH_EXP:1209600000}

oauth:
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    token-uri: https://oauth2.googleapis.com/token

server:
  servlet:
    context-path: /api

ssafy:
  finance:
    base-url: ${SSAFY_FINANCE_BASE_URL}
    api-key: ${SSAFY_FINANCE_API_KEY}
    institution-code: "00100"
    fintech-app-no: "001"

ai:
  base-url: ${AI_BASE_URL:http://localhost:8000}
  read-timeout: 120s
  ocr-read-timeout: 300s   # 서류 검증. AI 서버가 한 장씩 처리해 앞 요청을 기다리므로 RAG 보다 길게

file:
  # 업로드 파일 루트. 로컬은 backend/uploads, EC2 컨테이너는 /app/uploads (호스트 /home/ubuntu/app/uploads 마운트)
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}

mydata:
  # 갱신 1회에 GMS 크레딧 약 100 이 나간다. 연타를 막는다.
  refresh-cooldown: ${MYDATA_REFRESH_COOLDOWN:1h}

loan:
  product-sync:
    enabled: ${LOAN_PRODUCT_SYNC_ENABLED:true}   # 부팅 시 미등록 대출 상품을 금융망에 등록