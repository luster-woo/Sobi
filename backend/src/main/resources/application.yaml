spring:
  application:
    name: sobi-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/sobi
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    flyway:
      enabled: true
      baseline-on-migrate: true   # 기존 빈 DB에 처음 붙을 때 안전장치
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD}

  jackson:
    mapper:
      sort-properties-alphabetically: false