# 앱 컨테이너 배포 정의
# Jenkins가 이 파일을 /home/ubuntu/app/ 로 복사해서 실행합니다.
# 비밀번호·키는 서버 /home/ubuntu/app/.env 에서 주입됩니다. 여기에 값을 적지 마세요.

services:
  backend:
    image: sobi-backend:latest
    container_name: backend
    environment:
      TZ: Asia/Seoul
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      AI_BASE_URL: http://ai:8000
      GMS_API_KEY: ${GMS_API_KEY}
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
      JWT_SECRET: ${JWT_SECRET}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      SSAFY_FINANCE_BASE_URL: ${SSAFY_FINANCE_BASE_URL}
      SSAFY_FINANCE_API_KEY: ${SSAFY_FINANCE_API_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      FILE_UPLOAD_DIR: /app/uploads
      LOAN_PRODUCT_SYNC_ENABLED: "${LOAN_PRODUCT_SYNC_ENABLED:-true}"
    # 신청 서류 파일. 볼륨이 없으면 재배포마다 사라진다. 호스트에 디렉터리를 미리 만들어 둘 것
    volumes:
      - /home/ubuntu/app/uploads:/app/uploads
      - /home/ubuntu/app/documents/original:/data/document-agent/original
      - /home/ubuntu/app/documents/generated:/data/document-agent/generated
      - /home/ubuntu/app/documents/normalized:/data/document-agent/normalized
    networks: [backend, data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 1024M

  ai:
    image: sobi-ai:latest
    container_name: ai
    environment:
      TZ: Asia/Seoul
      HF_HOME: /models
      EMBEDDING_MODEL: nlpai-lab/KURE-v1
      EMBEDDING_DIM: "1024"
      EMBEDDING_MAX_LENGTH: "1024"
      OMP_NUM_THREADS: "4"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      GMS_API_KEY: ${GMS_API_KEY}
      DOCUMENT_AGENT_DRAFT_API_ENABLED: "true"
      DOCUMENT_AGENT_GENERATED_ROOT: /data/document-agent/generated
    volumes:
      - aimodels:/models
      - /home/ubuntu/app/documents/original:/data/document-agent/original
      - /home/ubuntu/app/documents/generated:/data/document-agent/generated
      - /home/ubuntu/app/documents/normalized:/data/document-agent/normalized
    networks: [backend, data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    deploy:
      resources:
        limits:
          memory: 4096M

  frontend:
    image: sobi-frontend:latest
    container_name: frontend
    networks: [backend]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  backend:
    external: true
    name: app_backend
  data:
    external: true
    name: app_data

volumes:
  aimodels:
