# 로컬 개발용 DB · Redis — 서버와 동일한 이미지 · 버전
#   실행:   docker compose -f deploy/docker-compose.local.yml up -d
#   종료:   docker compose -f deploy/docker-compose.local.yml down
#   초기화: docker compose -f deploy/docker-compose.local.yml down -v
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sogong-postgres-local
    environment:
      POSTGRES_DB: sogong
      POSTGRES_USER: sogong
      POSTGRES_PASSWORD: localdev
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - pgdata-local:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sogong"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sogong-redis-local
    command: >
      redis-server --requirepass localdev
      --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly no
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a localdev --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata-local:
