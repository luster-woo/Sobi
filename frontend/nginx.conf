server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 해시 붙은 정적 파일은 오래 캐시
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 은 절대 캐시하지 않음 (배포해도 옛 화면이 뜨는 사고 방지)
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA 라우팅: 없는 경로는 index.html 로
    location / {
        try_files $uri $uri/ /index.html;
    }
}
