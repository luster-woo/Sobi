server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 보안 헤더. ⚠️ add_header 는 상속되지 않아서 아래 location 마다 다시 include 한다
    # (자세한 이유는 security-headers.conf 첫 주석)
    include /etc/nginx/security-headers.conf;

    # 해시 붙은 정적 파일은 오래 캐시
    location /assets/ {
        include /etc/nginx/security-headers.conf;

        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 은 절대 캐시하지 않음 (배포해도 옛 화면이 뜨는 사고 방지)
    location = /index.html {
        include /etc/nginx/security-headers.conf;

        add_header Cache-Control "no-store";
    }

    # 서비스 워커도 캐시하지 않음.
    # 해시가 안 붙는 고정 이름이라 한 번 캐시되면 갱신할 방법이 없다.
    location = /mockServiceWorker.js {
        include /etc/nginx/security-headers.conf;

        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # SPA 라우팅: 없는 경로는 index.html 로
    location / {
        try_files $uri $uri/ /index.html;
    }
}
