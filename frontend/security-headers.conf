# 보안 응답 헤더 (S15P21D101-393)
#
# ⚠️ **nginx 의 add_header 는 상속되지 않는다.** 하위 location 에 add_header 가 하나라도
#    있으면 상위 레벨의 add_header 는 **전부** 무시된다. nginx.conf 의 location 셋이
#    Cache-Control 을 붙이고 있어서, server 레벨에만 두면 그 경로들에서 보안 헤더가
#    조용히 사라진다. 그래서 파일로 빼고 블록마다 include 한다.
#
#    새 location 을 추가할 때도 이 파일을 include 할 것.
#
# always 를 붙이는 이유: 없으면 2xx·3xx 에만 붙는다. 404·500 응답에도 필요하다.

# MIME 타입을 브라우저가 멋대로 추측하지 못하게 한다.
# 업로드한 파일이 text/plain 인데 스크립트로 실행되는 경로를 막는다.
add_header X-Content-Type-Options "nosniff" always;

# 클릭재킹 방지. 아래 CSP 의 frame-ancestors 와 같은 말인데, 이걸 모르는
# 구형 브라우저를 위해 같이 둔다.
add_header X-Frame-Options "DENY" always;

# 외부 사이트로 나갈 때 경로·쿼리를 넘기지 않는다. 같은 출처 안에서는 전체 URL 을
# 유지해서 분석에 쓸 수 있게 한다.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# 쓰지 않는 브라우저 기능을 끈다. 코드가 실수로 요청해도 권한 창이 뜨지 않는다.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# Content-Security-Policy
#
# 값마다 근거가 있다. 하나라도 틀리면 화면이 조용히 깨지므로 바꿀 때 아래를 확인할 것.
#
#   default-src 'self'
#     명시하지 않은 것은 전부 같은 출처만.
#
#   script-src 'self'
#     빌드 결과(dist/index.html)에 인라인 <script> 가 없다 — 전부 /assets/*.js 파일이다.
#     그래서 'unsafe-inline' 없이 갈 수 있다. Vite 설정을 바꿔 인라인 스크립트가
#     생기면 여기서 막히므로, 빌드 후 index.html 을 한 번 확인할 것.
#
#   style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net
#     'unsafe-inline' 이 필요하다 — React 의 style={{...}} 는 style 속성으로 나가고,
#     그건 style-src 가 관장한다. FavoritesPage 의 그리드 열 너비와 Skeleton 의 크기가
#     그 방식이다. style-src-attr 로 좁히는 방법이 있으나 지원이 고르지 않아, 지원되지
#     않는 브라우저에서 style-src 로 되돌아가며 화면이 깨진다.
#     jsdelivr 는 index.css 가 @import 로 폰트 CSS 를 불러오기 때문이다.
#
#   font-src 'self' https://cdn.jsdelivr.net
#     Pretendard·SUIT woff2 가 jsdelivr 에서 온다.
#
#   img-src 'self' data:
#     data: 는 현재 빌드에 없지만(0건), 아이콘을 인라인할 때 흔히 쓰여 열어 둔다.
#
#   connect-src 'self'
#     API 는 같은 출처의 /api/... 로 나간다(앞단 프록시가 백엔드로 넘긴다).
#     구글 로그인은 fetch 가 아니라 화면 이동(window.location)이라 여기 해당하지 않는다.
#
#     ⚠️ 개발자도구를 열면 콘솔에 이 경고가 뜬다 — 정상이다:
#         Connecting to 'https://cdn.jsdelivr.net/sm/....map' violates ... connect-src 'self'
#       jsdelivr 폰트 CSS 의 **소스맵**을 개발자도구가 받아오려다 막힌 것이다. 소스맵은
#       도구가 열려 있을 때만 요청하므로 실제 사용자에게는 영향이 없고, 폰트 자체는
#       font-src 로 정상 로딩된다.
#
#       여기에 jsdelivr 를 더하면 경고는 사라지지만, XSS 가 났을 때 데이터를 보낼 수 있는
#       외부 목적지가 하나 늘어난다. 콘솔 한 줄과 바꿀 만한 것이 아니라 두지 않는다.
#
#   worker-src 'self'
#     MSW 서비스워커(mockServiceWorker.js). 목을 켠 빌드에서만 돌지만 막아 둘 이유가 없다.
#
#   frame-ancestors 'none' · object-src 'none' · base-uri 'self' · form-action 'self'
#     각각 iframe 삽입, 플러그인, <base> 로 경로를 바꿔치기, 폼을 외부로 보내기를 막는다.
#
# ⚠️ upgrade-insecure-requests 와 Strict-Transport-Security 는 여기 두지 않았다.
#    이 nginx 는 앞단 프록시 뒤에서 http 로 서비스하고, TLS 종료는 그쪽이 한다 —
#    HSTS 는 TLS 를 끝내는 쪽에서 붙여야 한다.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; worker-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

# 서버 버전 숨기기. 취약점 있는 버전을 광고하지 않는다
server_tokens off;
